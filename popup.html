<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>MCP Bridge</title>
<style>
body{width:340px;font:13px system-ui,sans-serif;background:#0f172a;color:#e2e8f0;margin:0;padding:14px}
h2{font-size:14px;margin:0 0 8px;color:#38bdf8} input{width:100%;box-sizing:border-box;padding:6px;border-radius:6px;border:1px solid #334155;background:#1e293b;color:#fff}
button{background:#0284c7;color:#fff;border:0;border-radius:6px;padding:6px 10px;cursor:pointer;font-weight:600}
.row{display:flex;gap:6px;align-items:center;margin:6px 0} .u{flex:1;word-break:break-all} .dim{color:#94a3b8;font-size:12px}
.ok{color:#34d399}.bad{color:#f87171}
</style></head><body>
<h2>MCP Bridge for Arena</h2>
<div class="dim">MCP-серверы (SSE). Работает на arena.ai и lmarena.ai.</div>
<div class="row"><input id="url" placeholder="http://localhost:3000/sse"><button id="add">+</button></div>
<div id="list"></div>
<div class="dim" style="margin-top:8px">В чате: <code>/c http://localhost:3000/sse</code></div>
<script src="popup.js"></script>
</body></html>
